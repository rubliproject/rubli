# Rate limiting zones — defined at http context level (used by server block below)
# api_limit: 600 req/min per IP sustained (unchanged), burst 400 nodelay. A vendor dossier fires 27
# /api calls on load (counted 2026-10-30, /vendors/29277); burst 100 429'd four readers on one NAT IP
# (LAUNCH_AUDIT_2026-10-30 § S2). 400 ≈ 14 simultaneous dossier loads per IP; scrapers still meet the
# 10 r/s sustained cap once the burst drains. Over the limit → 429, not 503.
# issues_limit: 10 req/hour for public issue-submission endpoint (burst 5)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=issues_limit:1m rate=1r/m;
# heavy_limit (SECURITY_HARDENING_2026-10-28 § 4): the expensive paths — federated/institution
# search, CSV/Excel exports, dossier ZIP bundles, reports, folder exports — get a second, tighter
# bucket on top of api_limit: 30 req/min per IP, burst 30. An empty key is not counted, so the
# map leaves every other /api route on api_limit alone. Matched on $uri (decoded, normalised).
map $uri $heavy_key {
    default "";
    ~^/api/v1/(search|institutions/search|export/|dossier/|reports/|watchlist/folders/export/) $binary_remote_addr;
    ~^/api/v1/categories/[0-9]+/cover $binary_remote_addr;  # 45 s cold (SECURITY_REVIEW_2026-10-30 M2)
}
limit_req_zone $heavy_key zone=heavy_limit:10m rate=30r/m;
# contracts_global (PROD_IO_DIAGNOSIS_2026-10-30 § Fixes 3): ONE site-wide bucket for the contract
# list (/api/v1/contracts?..., the contract page's neighbour queries). A crawler on 412 rotating
# cloud IPs never trips a per-IP limit. Real traffic 2026-10-30 peaked at 30 list calls/min site-wide
# (mostly that crawler). Sized for launch (~200 readers ≈ 700 list calls/min, counted even on cache hits): 1200/min + burst 600. Caps a runaway crawler; over → 429 for that list only.
map $uri $contracts_global_key {
    default "";
    /api/v1/contracts contracts;
}
limit_req_zone $contracts_global_key zone=contracts_global:1m rate=1200r/m;

# Shared API cache (prod audit 2026-10-26): every backend cache is per gunicorn worker (6, recycled
# every ~1,000 requests), so a launch spike kept hitting cold paths (antes-del-fallo 7–11 s). Public
# GETs only, 10 min, one upstream fill per key (lock). Never: requests with credentials or the write
# key, and the health/auth/watchlist/feedback/issues/admin paths. The key carries a gzip flag
# because atlas.py gzips by hand from Accept-Encoding.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:20m max_size=500m inactive=60m use_temp_path=off;
map $request_uri $api_private {
    default 0;
    ~^/api/v1/(health|auth|watchlist|feedback|issues|admin|users?|me)(/|\?|$) 1;
}
# Crawlable but out of results (launch audit 2026-10-28 S4; = lib/seo/routeMeta NOINDEX_PREFIXES). An empty
# value sends no header. $request_uri survives the try_files hop to /index.html.
map $request_uri $robots_tag {
    default "";
    ~^/aria(/|\?|$) "noindex";
    ~^/vendors/      "noindex";
}
# Real 404s (press fact-check 2026-10-30): 1 when $uri matches a route of src/App.tsx.
# known-routes.map is generated at build by scripts/gen-head-shells.mjs (Dockerfile copies it here).
# Only consulted for paths that are not a file on disk (location @spa); /api/ never reaches it.
map $uri $known_route {
    default 0;
    include /etc/nginx/known-routes.map;
}
map $http_accept_encoding $api_gz {
    default "";
    ~*gzip  gz;
}

server {
    listen 80;
    limit_req_status 429;
    server_name localhost;
    server_tokens off;  # no nginx version in Server / error pages
    # Request bodies: the API takes only small JSON (login, feedback, issues, watchlist, dossier
    # notes); nothing uploads files. Bigger → 413 before the backend sees it (§ 4).
    client_max_body_size 128k;

    # Real client IP for limit_req (security B-04): requests arrive from Caddy on
    # the docker bridge, and Caddy rewrites X-Forwarded-For for untrusted clients.
    # Without this every visitor shares Caddy's IP = one global rate-limit bucket.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed .gz files generated at build time (zero per-request CPU)
    gzip_static on;

    # Runtime gzip fallback (for files not pre-compressed, e.g. index.html, API proxy)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/xml+rss
        application/wasm image/svg+xml;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection intentionally omitted — modern browsers ignore it;
    # setting "1; mode=block" triggers XSS auditor bugs in old Chromium builds.
    # The CSP below provides equivalent (and stronger) protection.
    # One policy string, enforced on the document and every route shell.
    # script-src has no 'unsafe-inline' (SECURITY_HARDENING_2026-10-28 § 3): the built pages carry
    # no executable inline script — only <script type="application/ld+json"> data blocks, which
    # script-src does not govern — and no inline event handlers. style-src keeps 'unsafe-inline'
    # (React style={{}} props and chart libraries set inline styles).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://*.wikipedia.org https://*.wikimedia.org; connect-src 'self' https://*.wikipedia.org https://*.wikimedia.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';";
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy - forward to backend
    location /api/ {
        limit_req zone=api_limit burst=400 nodelay;  # LAUNCH_AUDIT_2026-10-30 § S2
        limit_req zone=heavy_limit burst=30 nodelay;
        limit_req zone=contracts_global burst=600 nodelay;
        proxy_pass http://backend:8001/api/;
        proxy_cache api_cache;
        proxy_cache_key "$request_method$request_uri$api_gz";
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $http_authorization $http_x_rubli_key $api_private;
        proxy_no_cache $http_authorization $http_x_rubli_key $api_private;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public issue submission — strict rate limit (10/hour, burst 5)
    location = /api/v1/issues {
        limit_req zone=issues_limit burst=5 nodelay;
        proxy_pass http://backend:8001/api/v1/issues;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check proxy
    location = /health {
        proxy_pass http://backend:8001/health;
    }

    # FastAPI docs — restricted to localhost/internal networks only in production.
    # Remove the allow/deny rules in local dev if you need browser access to /docs.
    location = /docs {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://backend:8001/docs;
        proxy_set_header Host $host;
    }
    location = /redoc {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://backend:8001/redoc;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://backend:8001/openapi.json;
        proxy_set_header Host $host;
    }

    # GeoJSON files — explicit MIME type so browsers parse correctly
    location ~* \.geojson$ {
        add_header Content-Type "application/geo+json";
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Long-lived static files (PERF launch § 5): hashed bundles in /assets/,
    # self-hosted faces in /fonts/, social cards in /og/, logos in /logos/.
    # One Cache-Control header (the old `expires 1y` + add_header sent two).
    # /og/ and /logos/ are not content-hashed: rename the file to bust it.
    location ~ ^/(assets|fonts|og|logos)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Crawl files: always revalidate.
    location ~ ^/(sitemap\.xml|robots\.txt|manifest\.json|theme-boot\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Head shells (scripts/gen-head-shells.mjs): the same SPA document, but its
    # <head> carries that story's / the dataset's title, card, canonical and
    # JSON-LD for crawlers and link previews that never run JS (joker review 09).
    # Headers repeat the /index.html block (add_header inheritance).
    # Every single-segment route too (SEO audit 2026-10-26): /sectors → sectors.html when a shell
    # exists, else index.html — same document, same headers. Exact (=) locations above still win.
    location ~ ^/(stories/[a-z0-9-]+|[a-z0-9-]+)$ {
        try_files /$1.html @spa;
        add_header Cache-Control "no-store, no-cache, must-revalidate";  # one header: `expires` added a second
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
    }

    # SPA routing - every App.tsx route goes to index.html; any other path gets a real 404 whose body
    # is 404.html (the same SPA document, robots noindex), so the app still boots and shows NotFound.
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        error_page 404 /404.html;
        if ($known_route = 0) { return 404; }
        rewrite ^ /index.html last;
    }
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Disable caching for index.html
    # Any add_header here drops ALL server-level headers for the HTML (nginx
    # inheritance), which is how index.html shipped with no CSP (live-audit L2).
    # Repeat them. CSP enforced on the document since 2026-10-15 (13 routes
    # checked headless with Report-Only: 0 violations).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";  # one header: `expires` added a second
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
    }
}
