[pytest]
# Only backend/tests/ is the suite. Stray test_*.py under scripts/ and hyperion/
# are dev utilities with extra deps (rapidfuzz, requests) and broke CI collection.
testpaths = tests
# Default = fast suite (pre-deploy gate). Slow full-scan tests: `-m slow` (nightly);
# everything: `-m "slow or not slow"`. See tests/README.md.
addopts = -m "not slow"
markers =
    no_db: self-contained test (own fixture DB) that runs even without the full database
    slow: full-table scan / cold precompute check (>~20 s on a cold HDD) — excluded by default, run nightly with -m slow
