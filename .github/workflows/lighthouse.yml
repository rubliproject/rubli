name: Lighthouse CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Build frontend
        run: cd frontend && npm run build

      # /api/ is proxied to prod by vite preview (server.proxy); no local backend in CI
      - name: Start preview server
        env:
          VITE_API_URL: https://rubli.xyz
        run: |
          cd frontend && npm run preview -- --port 4173 &
          sleep 8

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/dashboard
            http://localhost:4173/atlas
            http://localhost:4173/sectors
            http://localhost:4173/stories/captura-institucional
          configPath: '.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
